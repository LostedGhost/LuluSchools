# Render Blueprint pour le backend LuluSchools (voir docs/adr/ADR-006-deploiement-render-vercel.md).
#
# Premier deploiement :
#   1. Sur Render : New > Blueprint, pointer sur ce depot, branche main. Render lit ce
#      fichier et cree a la fois le service web et la base PostgreSQL ci-dessous.
#   2. Render demande les valeurs des variables marquees `sync: false` ci-dessous
#      (cles FreeLLM/LuluFiles/Kkiapay/Brevo, jamais stockees dans ce fichier).
#   3. Une fois le service en ligne, noter son URL reelle (https://<nom>.onrender.com)
#      et mettre a jour :
#        - frontend/vercel.json (destination des rewrites /api/*)
#        - CORS_ALLOW_ORIGINS ci-dessous avec le domaine Vercel reel
#        - l'URL de webhook dans le dashboard Kkiapay (Cles API > Webhook)
#
# Limites du plan gratuit (voir docs/deploiement-render-vercel.md) :
#   - Pas de disque persistant (`disk`) : le casier judiciaire n'est donc jamais ecrit
#     sur le disque local du service (perdu a chaque redemarrage/veille) mais chiffre
#     (Fernet, cle CASIER_JUDICIAIRE_ENCRYPTION_KEY) et stocke dans la base Postgres.
#   - Le service web se met en veille apres 15 min sans trafic (premiere requete
#     suivante ~50s plus lente le temps du reveil).
#   - La base PostgreSQL gratuite expire 30 jours apres sa creation (14 jours de grace
#     avant suppression definitive, pas de sauvegarde automatique) : passer sur un plan
#     payant ou exporter/reimporter (`pg_dump`/`psql`) avant l'echeance pour tout usage
#     au-dela d'une demo/pilote courte.

services:
  - type: web
    name: luluschools-backend
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: ENVIRONMENT
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: luluschools-db
          property: connectionString

      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"

      - key: FREELLM_BASE_URL
        value: https://freellm-lucio.onrender.com/v1
      - key: FREELLM_API_KEY
        sync: false

      - key: LULUFILES_BASE_URL
        value: https://lulufiles-api.onrender.com
      - key: LULUFILES_API_KEY
        sync: false

      - key: KKIAPAY_PUBLIC_KEY
        sync: false
      - key: KKIAPAY_PRIVATE_KEY
        sync: false
      - key: KKIAPAY_SECRET
        sync: false
      - key: KKIAPAY_SANDBOX
        value: "false"

      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: LuluSchools

      # Chiffre le contenu du casier judiciaire stocke en base (voir
      # VerificationCasierJudiciaire.contenu_chiffre) - genere une fois par Render,
      # jamais visible dans ce depot.
      - key: CASIER_JUDICIAIRE_ENCRYPTION_KEY
        generateValue: true

      # A remplacer par le(s) domaine(s) Vercel reel(s) une fois connu(s), au format
      # JSON (le champ est une liste cote backend) : ["https://luluschools.vercel.app"]
      - key: CORS_ALLOW_ORIGINS
        value: '["https://luluschools.vercel.app"]'

databases:
  - name: luluschools-db
    plan: free
    region: frankfurt
    databaseName: luluschools
    user: luluschools_user
